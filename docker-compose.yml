# MySQL de desenvolvimento e testes (o mesmo banco do cPanel): acidi (site/admin) e acidi_teste (npm run test:db)
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: acidi
      MYSQL_USER: acidi
      MYSQL_PASSWORD: acidi
      MYSQL_DATABASE: acidi
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"  # 3306 costuma estar ocupada por outro MySQL local
    volumes:
      - mysqldados:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  mysqldados:
